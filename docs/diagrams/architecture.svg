<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="t d">
  <title id="t">Arsitektur RANTAI: mode Cloudflare dan mode on-premise</title>
  <desc id="d">Dua jalur deploy memakai UI React yang sama. Mode Cloudflare: Vite build dilayani Cloudflare Worker berbasis Hono yang memakai D1 dan WebCrypto. Mode on-premise: Node dengan Hono memakai node:sqlite dan filesystem evidence. Keduanya berbagi antarmuka EvidenceStorage.</desc>

  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #cfd6df; stroke-width: 1.5; }
    .panel-soft { fill: #f7f9fc; stroke: #e1e5ea; stroke-width: 1.5; }
    .lane { fill: #f7f9fc; stroke: #e1e5ea; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #cfd6df; stroke-width: 1.5; }
    .node-accent { fill: #f2f7ff; stroke: #1866db; stroke-width: 1.5; }
    .node-core { fill: #e8f0fe; stroke: #1866db; stroke-width: 2; }
    .navy { fill: #2c3644; }
    .t { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; fill: #202a36; }
    .t-title { font-family: Archivo, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #202a36; letter-spacing: -.4px; }
    .t-sub { font-family: Archivo, Arial, sans-serif; font-size: 13px; fill: #55647a; }
    .t-node { font-family: Archivo, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #202a36; }
    .t-note { font-family: Archivo, Arial, sans-serif; font-size: 11.5px; fill: #55647a; }
    .t-lane { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #354152; letter-spacing: .08em; }
    .t-mono { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 11px; fill: #354152; }
    .flow { stroke: #1866db; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .flow-dim { stroke: #8d9aac; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowDim); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1866db"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d9aac"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="520"/>

  <text class="t-title" x="40" y="52">Arsitektur RANTAI</text>
  <text class="t-sub" x="40" y="76">Satu UI React, dua jalur deploy, tanpa panggilan keluar saat runtime.</text>

  <!-- Cloudflare lane -->
  <rect class="lane" x="40" y="104" width="960" height="180" rx="4"/>
  <text class="t-lane" x="60" y="130">MODE CLOUDFLARE · TERKELOLA</text>

  <rect class="node-accent" x="60" y="146" width="176" height="70" rx="3"/>
  <text class="t-node" x="148" y="176" text-anchor="middle">React 19 + Vite</text>
  <text class="t-note" x="148" y="196" text-anchor="middle">dist/ statis</text>

  <path class="flow" d="M236 181 L316 181"/>

  <rect class="node-core" x="316" y="146" width="212" height="70" rx="3"/>
  <text class="t-node" x="422" y="176" text-anchor="middle">Cloudflare Worker</text>
  <text class="t-note" x="422" y="196" text-anchor="middle">Hono · API + auth</text>

  <path class="flow" d="M528 166 L616 140"/>
  <path class="flow" d="M528 196 L616 222"/>

  <rect class="node" x="616" y="108" width="200" height="64" rx="3"/>
  <text class="t-node" x="716" y="136" text-anchor="middle">D1 · SQLite</text>
  <text class="t-note" x="716" y="155" text-anchor="middle">BLOB bukti · audit</text>

  <rect class="node" x="616" y="190" width="200" height="64" rx="3"/>
  <text class="t-node" x="716" y="218" text-anchor="middle">WebCrypto</text>
  <text class="t-note" x="716" y="237" text-anchor="middle">SHA-256 · HMAC · Ed25519</text>

  <!-- On-premise lane -->
  <rect class="lane" x="40" y="308" width="960" height="180" rx="4"/>
  <text class="t-lane" x="60" y="334">MODE ON-PREMISE · OFFLINE</text>

  <rect class="node-accent" x="60" y="350" width="176" height="70" rx="3"/>
  <text class="t-node" x="148" y="380" text-anchor="middle">React 19 + Vite</text>
  <text class="t-note" x="148" y="400" text-anchor="middle">dist/ dilayani Node</text>

  <path class="flow" d="M236 385 L316 385"/>

  <rect class="node-core" x="316" y="350" width="212" height="70" rx="3"/>
  <text class="t-node" x="422" y="380" text-anchor="middle">Node + Hono</text>
  <text class="t-note" x="422" y="400" text-anchor="middle">@hono/node-server</text>

  <path class="flow" d="M528 370 L616 344"/>
  <path class="flow" d="M528 400 L616 426"/>

  <rect class="node" x="616" y="312" width="200" height="64" rx="3"/>
  <text class="t-node" x="716" y="340" text-anchor="middle">node:sqlite</text>
  <text class="t-note" x="716" y="359" text-anchor="middle">shim antarmuka D1</text>

  <rect class="node" x="616" y="394" width="200" height="64" rx="3"/>
  <text class="t-node" x="716" y="422" text-anchor="middle">filesystem</text>
  <text class="t-note" x="716" y="441" text-anchor="middle">evidence/ · hingga 50 MB</text>

  <!-- Shared storage interface -->
  <rect class="panel-soft" x="864" y="216" width="118" height="160" rx="3"/>
  <text class="t-mono" x="923" y="258" text-anchor="middle">Evidence</text>
  <text class="t-mono" x="923" y="274" text-anchor="middle">Storage</text>
  <text class="t-note" x="923" y="300" text-anchor="middle">put / get</text>
  <text class="t-note" x="923" y="316" text-anchor="middle">/ delete</text>
  <text class="t-note" x="923" y="344" text-anchor="middle">900 KB · D1</text>
  <text class="t-note" x="923" y="360" text-anchor="middle">50 MB · disk</text>

  <path class="flow-dim" d="M816 140 L876 214"/>
  <path class="flow-dim" d="M816 426 L876 382"/>
</svg>
